org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=37

# AGP 9.4's built-in Kotlin support conflicts with our explicit org.jetbrains.kotlin.android
# plugin (needed alongside kotlin.plugin.compose/serialization) - these two flags keep the
# pre-9.0 Kotlin plugin model. Google removes this opt-out in AGP 10.0, so this is temporary.
android.builtInKotlin=false
android.newDsl=false
